name: Verify VBot SDK release and Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Demo from the public release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :demo:assembleDebug
          version="$(python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.argv[1]).getroot().findtext("{*}version"))' distribution/pom.xml)"
          aar="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/vbot-release-maven/com/vita/vbot/vbot-sdk/$version/vbot-sdk-$version.aar"
          cmp <(unzip -p "$aar" jni/arm64-v8a/libvbot_sdk.so) \
              <(unzip -p demo/build/outputs/apk/debug/demo-debug.apk lib/arm64-v8a/libvbot_sdk.so)
